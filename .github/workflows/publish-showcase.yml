# Publish ONE Research- website from site/. No historical V2 application bundle.
name: Publish Research Showcase

on:
  pull_request:
    paths:
      - 'site/**'
      - 'research/**'
      - 'docs/governance/**'
      - 'showcase/design/**'
      - '.github/workflows/publish-showcase.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'research/**'
      - 'docs/governance/**'
      - 'showcase/design/**'
      - 'README.md'
      - '.github/workflows/publish-showcase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-showcase-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Single Astro site artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout with full source provenance (pinned)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 24 (pinned)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install locked Astro dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependencies (high and critical block)
        working-directory: site
        run: npm audit --audit-level=high
      - name: Verify source metadata, research taxonomy and Astro contracts
        working-directory: site
        run: npm run check
      - name: Build research pages and both search indexes
        working-directory: site
        run: npm run build
      - name: Verify Markdown source SHA provenance
        working-directory: site
        run: npm run provenance
      - name: Assemble exactly one Pages website
        working-directory: site
        run: node scripts/unify-home.mjs
      - name: Reject legacy duplicate sites and verify exact source routes
        working-directory: site
        run: node scripts/verify-pages-bundle.mjs
      - name: Install Chromium for actual browser integration tests
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Test real root, research routes, mobile and old-link redirects
        working-directory: site
        run: npx playwright test --config playwright.pages.config.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: single-site-browser-evidence
          path: |
            site/test-results/
            site/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified single-site artifact for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/pages-dist
  deploy:
    name: Deploy verified single Research- website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish vetted single-site artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
