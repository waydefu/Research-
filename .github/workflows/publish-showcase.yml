# Publish Sanctum as the root, archived V2 under /v2/, and V3 research under /v3/.
# Never publish the repository root; PR checks only build, they cannot deploy.
# Manual prerequisite (Repo Owner): Settings > Pages > Build and deployment > Source > GitHub Actions.
name: Publish Research Showcase

on:
  pull_request:
    paths:
      - 'showcase/**'
      - 'site/**'
      - 'research/**'
      - 'docs/governance/**'
      - '.github/workflows/publish-showcase.yml'
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'site/**'
      - 'research/**'
      - 'docs/governance/**'
      - 'README.md'
      - '.github/workflows/publish-showcase.yml'
  workflow_dispatch:

# A read-only default token. Only the gated deploy job can publish Pages.
permissions:
  contents: read

# Keep PR builds separate from production deployment. With a single shared
# concurrency group, a new pending PR run can replace and cancel a queued
# main push run even when cancel-in-progress is false.
concurrency:
  group: research-showcase-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: V2 + V3 static Pages artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # V3 per-document source SHA/date requires real Git history
      - name: Set up Node.js 24 without npm dependencies
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 / Node.js 24 action runtime
        with:
          node-version: '24'
      - name: Run showcase syntax and lifecycle tests
        run: npm --prefix showcase run check
      - name: Build actual repository Markdown into a static website
        run: npm --prefix showcase run build
      - name: Verify published site root and source provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, statSync, existsSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const root = 'showcase/dist/';
          for (const path of [
            'index.html', 'app.js', 'artifact.js', 'mesh-core.js', 'scene-director.js', 'interaction-core.js', 'qa-metrics.js', 'reader-links.js', 'styles.css',
            'assets/favicon.svg', 'assets/og.svg', 'data/research-index.json'
          ]) {
            assert.ok(statSync(root + path).size > 0, `Missing built asset: ${path}`);
          }
          const html = readFileSync(root + 'index.html', 'utf8');
          assert.match(html, /THE UNKNOWN,/);
          assert.match(html, /\.\/styles\.css/);
          assert.match(html, /\.\/app\.js/);
          for (const font of ['instrument-serif-regular.ttf','instrument-serif-italic.ttf','manrope-variable.ttf','ibm-plex-mono.ttf']) {
            assert.ok(statSync(root + 'assets/fonts/' + font).size > 10000, 'Missing self-hosted font: ' + font);
          }
          assert.doesNotMatch(html, /(?:src|href)=["']\/(?:assets|showcase|Research-)/);
          const index = JSON.parse(readFileSync(root + 'data/research-index.json', 'utf8'));
          assert.equal(index.sourceCommit, process.env.GITHUB_SHA, 'Index must use this exact checkout');
          assert.ok(index.documents.length >= 55, 'Incomplete live Markdown index');
          assert.equal(new Set(index.documents.map(x => x.path)).size, index.documents.length, 'Duplicate source paths');
          for (const doc of index.documents) {
            assert.ok(doc.title && doc.group && doc.path);
            assert.ok(existsSync(doc.path), `Missing research source: ${doc.path}`);
          }
          console.log('Publishable Showcase, documents:', index.documents.length, 'from', index.sourceCommit);
          NODE
          # Static GitHub Pages must not treat the built directory as a Jekyll source tree.
          touch showcase/dist/.nojekyll
      - name: Install locked V3 dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Validate V3 Astro source and catalog
        working-directory: site
        run: npm run check
      - name: Generate full V3 research HTML and Pagefind search index
        working-directory: site
        run: npm run build
      - name: Check V3 per-document Git provenance
        working-directory: site
        run: npm run provenance
      - name: Package V3 as an isolated /v3/ subdirectory beside V2
        shell: bash
        run: |
          mkdir -p showcase/dist/v3
          cp -a site/dist/. showcase/dist/v3/
      - name: Stage one Sanctum homepage and archive the previous V2
        working-directory: site
        run: node scripts/unify-home.mjs
      - name: Verify unified homepage and preserved V2/V3 research bundle
        working-directory: site
        run: node scripts/verify-pages-bundle.mjs
      - name: Install Chromium for actual V2-to-V3 navigation checks
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Browser test V2 article links and GitHub-source fallback
        working-directory: site
        run: npx playwright test --config playwright.pages.config.mjs
      - name: Upload V2 reader browser test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v2-v3-reader-test-evidence
          path: site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified V2 + V3 from showcase/dist only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: showcase/dist

  deploy:
    name: Deploy verified V2 + V3 bundle to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
