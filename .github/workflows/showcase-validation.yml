# A read-only, dependency-free build gate for the public Research Showcase.
# Does not publish, set Pages permissions, or access secrets.
name: Showcase static validation

on:
  pull_request:
    paths:
      - 'showcase/**'
      - '.github/workflows/showcase-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcase-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Showcase build, index and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout without persisted credentials (pinned action)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Validate HTML/JS indexer and unit tests (no npm install)
        run: npm --prefix showcase run check
      - name: Build from actual Repository Markdown (no npm install)
        run: npm --prefix showcase run build
      - name: Verify static deploy bundle and complete source index
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const base = "showcase/dist";
            for (const name of ["index.html","styles.css","app.js","artifact.js","mesh-core.js","data/research-index.json","assets/favicon.svg","assets/og.svg"]) {
              assert.ok(fs.statSync(`${base}/${name}`).size > 0, `missing ${name}`);
            }
            const index=JSON.parse(fs.readFileSync(`${base}/data/research-index.json`,"utf8"));
            assert.ok(index.documents.length >= 55);
            assert.equal(new Set(index.documents.map(x=>x.path)).size,index.documents.length);
            assert.match(index.sourceCommit,/^[0-9a-f]{40}$/);
            for (const item of index.documents) {
              assert.ok(fs.existsSync(item.path),item.path);
              assert.ok(item.title && item.group);
            }
            console.log("Showcase:",index.documents.length,"source-linked documents at",index.sourceCommit);
          '
