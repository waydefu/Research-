# Research-only, non-privileged checks. No secrets or write permissions.
name: Research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Markdown, JSON and governance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (pinned v5.0.1, Node.js 24)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Check documents without dependencies
        run: python3 scripts/check_repository.py
      - name: Build and verify real repository search index
        run: |
          python3 scripts/research_search.py build
          python3 scripts/research_search.py verify
          python3 scripts/research_search.py search 'EAG-100' --limit 3
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Analyze GitHub Actions with zizmor (pinned action)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          version: v1.7.0
