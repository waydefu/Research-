# Research-only, non-privileged checks. No secrets or write permissions.
name: Research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Markdown, JSON and governance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (pinned v5.0.1, Node.js 24)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0 # Exact original SHA/date and source provenance need Git history
      - name: Check documents without dependencies
        run: python3 scripts/check_repository.py
      - name: Build and verify real repository search index
        run: |
          python3 scripts/research_search.py build
          python3 scripts/research_search.py verify
          python3 scripts/research_search.py search 'EAG-100' --limit 3
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Analyze GitHub Actions with zizmor (pinned action)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          version: v1.7.0

      # This job name is already required by main-eag-100. Keep this job name and
      # unfiltered pull_request trigger; any failure must fail the required check.
      # Site CI cannot be a path-filtered required job (skipped workflows can stall).
      - name: Set up Node.js 24 for mandatory website tests (pinned)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install locked V3 dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Audit npm dependency supply chain (high and critical findings block)
        working-directory: site
        run: npm audit --audit-level=high
      - name: Verify Astro, metadata, search and content unit contracts
        working-directory: site
        run: npm run check
      - name: Build V3 and both search indexes
        working-directory: site
        run: npm run build
      - name: Verify exact Markdown source provenance
        working-directory: site
        run: npm run provenance
      - name: Install Chromium and required dependencies
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run P0-P1 browser, keyboard, accessibility, no-JS and viewport checks
        working-directory: site
        run: npm run e2e
      - name: Save mandatory browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: required-p1-browser-evidence
          path: |
            site/test-results/
            site/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
