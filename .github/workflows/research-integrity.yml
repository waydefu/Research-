# Research-only, non-privileged checks. No secrets or write permissions.
name: Research integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Markdown, JSON and governance integrity
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout (pinned v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check documents without dependencies
        run: python3 scripts/check_repository.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
