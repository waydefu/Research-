# V3 P0 static research archive validation; no deploy, no credentials or write permissions.
name: V3 P0 build and checks

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/v3-p0-build.yml'
      - 'research/**'
      - 'docs/governance/**'
      - 'showcase/design/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-p0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p0:
    name: Install, validate and build Astro
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout with full provenance (pinned)
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js 22 (pinned)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Check runtime
        run: |
          node --version
          npm --version
      # Bootstrap only until the generated lockfile has been reviewed and committed.
      # After committing site/package-lock.json, replace npm install with npm ci.
      - name: Install dependencies and generate lockfile
        working-directory: site
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Astro and catalog tests
        working-directory: site
        run: npm run check
      - name: Build static research museum and Pagefind
        working-directory: site
        run: npm run build
      - name: Audit all source SHA/date values
        working-directory: site
        run: npm run provenance
      - name: Install Chromium with required system dependencies
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Browser UX, 20 zh-TW searches, no-JS and axe checks
        working-directory: site
        run: npm run e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-p0-browser-evidence
          path: |
            site/test-results/
            site/playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload npm lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-p0-generated-package-lock
          path: site/package-lock.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload built HTML for review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-p0-static-site
          path: site/dist/
          retention-days: 7

  lockfile:
    name: Commit P0 lockfile to the feature branch (one-time)
    needs: p0
    # Only this Owner-controlled PR branch. No PR scripts execute with write credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 20 && github.event.pull_request.head.repo.full_name == 'waydefu/Research-' && github.event.pull_request.head.ref == 'feat/v3-p0-content-museum-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Read exact PR head without storing credentials
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Generate reproducible dependency lock without running package scripts
        working-directory: site
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only if missing or changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- site/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(v3): commit reproducible npm lockfile"
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/feat/v3-p0-content-museum-20261102
