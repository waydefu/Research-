<title id="title">THE OBSERVATORY V2 — Evidence Engine desktop art direction concept board</title>
<desc id="desc">An original dark celestial research interface concept with a warm gold annular instrument, cool cyan traces, editorial typography and source-oriented calls to action; not a deployed website screenshot.</desc>
